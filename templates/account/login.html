{% extends "base.html" %}
{% block title %}{{ t('account_login_title') }} — Amor Flowers{% endblock %}
{% block content %}
<div class="container section">
  <form method="post" class="form-card">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <h1 style="font-style:italic; text-align:center; margin-bottom:24px;">{{ t('account_login_title') }}</h1>
    {% if error %}<div class="form-error">{{ error }}</div>{% endif %}
    <div class="form-group">
      <label>{{ t('account_phone') }}</label>
      <input type="tel" name="phone" required placeholder="+7 7__ ___ __ __"
             value="+7" inputmode="tel" autocomplete="tel" class="js-phone">
    </div>
    <div class="form-group">
      <label>{{ t('account_password') }}</label>
      <input type="password" name="password" required>
    </div>
        <p style="text-align:right; margin:-8px 0 16px; font-size:13.5px;">
      <a href="{{ url_for('account_forgot') }}" style="color:var(--rose-deep);">Забыли пароль?</a>
    </p>
<button type="submit" class="btn btn-primary btn-block">{{ t('account_login_submit') }}</button>

    <p style="text-align:center; margin-top:18px; font-size:13.5px; color:var(--ink-soft);">
      {{ t('account_no_account') }} <a href="{{ url_for('account_register') }}" style="color:var(--rose-deep);">{{ t('account_register_link') }}</a>
    </p>
  </form>
</div>
{% endblock %}
