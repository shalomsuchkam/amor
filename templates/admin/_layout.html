<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Админ-панель{% endblock %} — Amor Flowers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/liquid.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
{% import "_macros.html" as m %}
<div class="admin-shell">
  <aside class="admin-sidebar">
    <a href="{{ url_for('admin_dashboard') }}" class="logo">
      {{ m.logo_mark(30) }}
      <span class="logo-text">Amor <span>Admin</span></span>
    </a>
    <nav>
      <a href="{{ url_for('admin_dashboard') }}" class="{{ 'active' if request.endpoint == 'admin_dashboard' }}">Обзор</a>
      <a href="{{ url_for('admin_orders') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('admin_order') }}">Заказы{% if nav_counts.new_orders %}<span class="nav-count">{{ nav_counts.new_orders }} новых</span>{% endif %}</a>
      <a href="{{ url_for('admin_products') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('admin_product') }}">Товары<span class="nav-count">{{ nav_counts.products }}</span></a>
      <a href="{{ url_for('admin_reviews') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('admin_review') }}">Отзывы</a>
      <a href="{{ url_for('admin_ads') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('admin_ads') }}">Реклама</a>
      <a href="{{ url_for('home') }}" target="_blank">Открыть сайт ↗</a>
      <a href="{{ url_for('admin_logout') }}" style="margin-top:20px; opacity:.7;">Выйти</a>
    </nav>
  </aside>
  <main class="admin-main">
    {% block admin_content %}{% endblock %}
  </main>
</div>
</body>
</html>
