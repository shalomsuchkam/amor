<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход в админ-панель — Amor Flowers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
{% import "_macros.html" as m %}
<form method="post" class="form-card">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div style="display:flex; justify-content:center; margin-bottom:18px;">{{ m.logo_mark(56) }}</div>
  <h1 style="font-style:italic; text-align:center; margin-bottom:24px;">Админ-панель</h1>
  {% if error %}<div class="form-error">{{ error }}</div>{% endif %}
  <div class="form-group">
    <label>Логин</label>
    <input type="text" name="username" required autofocus>
  </div>
  <div class="form-group">
    <label>Пароль</label>
    <input type="password" name="password" required>
  </div>
  <button type="submit" class="btn btn-primary btn-block">Войти</button>
</form>
</body>
</html>
